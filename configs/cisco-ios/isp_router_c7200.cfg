! ==============================================================================
! Cisco Edge Router Configuration
! Hostname: ISP
! Role: Internet Service Provider simulation & Edge Source NAT / PAT
! ==============================================================================

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISP
!
! --- WAN Interface to Internet-Cloud1 (DHCP / Outside) ---
interface GigabitEthernet0/0
 description Internet-Cloud1 Connection (Public Outside IP)
 ip address dhcp
 ip nat outside
 duplex auto
 speed auto
 no shutdown
!
! --- Uplink Interface to FortiGate Port 4 (Inside) ---
interface GigabitEthernet0/1
 description FortiGate Port4 WAN Link (200.1.1.0/24)
 ip address 200.1.1.1 255.255.255.0
 ip nat inside
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/3
 description Alternate FortiGate WAN Link
 ip address 200.1.1.1 255.255.255.0
 ip nat inside
 shutdown
!
! --- NAT / PAT Overload Configuration ---
! Translates FortiGate WAN traffic to the public ISP external DHCP IP
ip access-list standard FW-WAN-IP-LIST
 permit 200.1.1.0 0.0.0.255
!
ip nat inside source list FW-WAN-IP-LIST interface GigabitEthernet0/0 overload
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
