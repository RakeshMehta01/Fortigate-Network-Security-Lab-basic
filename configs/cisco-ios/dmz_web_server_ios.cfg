! ==============================================================================
! Cisco IOS Web Server Configuration
! Hostname: Web-Server
! Role: DMZ Published Web & Management Host (HTTP, SSH, Telnet, TFTP)
! FQDN / Domain: pinglabs.in
! ==============================================================================

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Web-Server
!
ip domain name pinglabs.in
!
! --- Local User Authentication ---
username test password 0 test
username admin privilege 15 password 0 Admin@123
!
! --- Network Interface in DMZ (VLAN 99) ---
interface GigabitEthernet0/0
 description DMZ Network Interface (Connected to DMZ-Switch Gi0/0)
 ip address 10.1.99.99 255.255.255.0
 duplex auto
 speed auto
 no shutdown
!
! --- Gateway of Last Resort pointing to FortiGate Port 3 ---
ip route 0.0.0.0 0.0.0.0 10.1.99.41
!
! --- Services: HTTP Web Server ---
ip http server
ip http authentication local
!
! --- Services: TFTP Server ---
tftp-server flash0:/nvram
!
! --- SSH and Telnet Remote Access ---
crypto key generate rsa modulus 1024
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input telnet ssh
!
end
