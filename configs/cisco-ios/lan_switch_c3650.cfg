! ==============================================================================
! Cisco Catalyst Layer 3 Switch Configuration
! Hostname: LAN-Switch
! Role: Core/Distribution Routing, VLAN Gateway (SVIs), Dynamic OSPF Router
! ==============================================================================

version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname LAN-Switch
!
boot-start-marker
boot-end-marker
!
ip routing
!
! --- VLAN Database Definition ---
vlan 10
 name User
!
vlan 20
 name Developer
!
vlan 30
 name Admin
!
! --- Layer 2 Access Ports Assignment ---
! VLAN 10 (Users: VPC2, Linux5)
interface GigabitEthernet0/0
 description Connects to Linux5 (eth0)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/1
 description Connects to VPC2 (eth0)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
! VLAN 20 (Developers: PC3, Linux6)
interface GigabitEthernet0/2
 description Connects to PC3 (eth0)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description Connects to Linux6 (eth0)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
! VLAN 30 (Admins: PC4, Linux7)
interface GigabitEthernet1/0
 description Connects to PC4 (eth0)
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/1
 description Connects to Linux7 (eth0)
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
! Transit Uplink to FortiGate Port 2
interface GigabitEthernet1/2
 description Uplink to FortiGate Port2 (Transit Subnet 10.1.1.0/24)
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface GigabitEthernet1/3
 description Local Management / Spare
 switchport mode access
 switchport access vlan 1
 no shutdown
!
! --- Switch Virtual Interfaces (SVI / Gateways) ---
interface Loopback0
 description OSPF Router ID & Network Identifier
 ip address 10.1.0.254 255.255.255.255
 ip ospf 1 area 0
!
interface Vlan1
 description Transit Link to FortiGate NGFW
 ip address 10.1.1.254 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Vlan10
 description Gateway for VLAN 10 Users
 ip address 10.1.10.254 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Vlan20
 description Gateway for VLAN 20 Developers
 ip address 10.1.20.254 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
interface Vlan30
 description Gateway for VLAN 30 Administrators
 ip address 10.1.30.254 255.255.255.0
 ip ospf 1 area 0
 no shutdown
!
! --- Routing Configuration ---
! Default route pointing to FortiGate Port2 inside interface
ip route 0.0.0.0 0.0.0.0 10.1.1.41
!
! Dynamic Routing: OSPF Area 0
router ospf 1
 router-id 10.1.0.254
 log-adjacency-changes
 passive-interface GigabitEthernet0/0
 passive-interface GigabitEthernet0/1
 passive-interface GigabitEthernet0/2
 passive-interface GigabitEthernet0/3
 passive-interface GigabitEthernet1/0
 passive-interface GigabitEthernet1/1
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
