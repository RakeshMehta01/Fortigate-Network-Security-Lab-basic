# ==============================================================================
# FortiGate NGFW - System Interfaces Configuration
# Topology Role: Core Perimeter Next-Generation Firewall
# ==============================================================================

# --- Port 1: Out-of-Band Management (OOBM) / GUI Access ---
config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 192.168.254.41 255.255.255.0
        set allowaccess ping https ssh http telnet
        set type physical
        set description "HOST-Only Management Network (MGMT-Cloud0)"
        set snmp-index 1
    next
end

# --- Port 2: Inside LAN Transit Interface ---
config system interface
    edit "port2"
        set vdom "root"
        set mode static
        set ip 10.1.1.41 255.255.255.0
        set allowaccess ping ssh
        set type physical
        set description "Uplink to Core LAN-Switch (VLAN 1 Transit)"
        set snmp-index 2
    next
end

# --- Port 3: DMZ Interface ---
config system interface
    edit "port3"
        set vdom "root"
        set mode static
        set ip 10.1.99.41 255.255.255.0
        set allowaccess ping
        set type physical
        set description "Isolated DMZ Segment (VLAN 99 / Web-Server)"
        set snmp-index 3
    next
end

# --- Port 4: Outside / WAN Interface ---
config system interface
    edit "port4"
        set vdom "root"
        set mode static
        set ip 200.1.1.41 255.255.255.0
        set allowaccess ping
        set type physical
        set description "Uplink to ISP Edge Router (200.1.1.0/24)"
        set snmp-index 4
    next
end

# --- System DNS Configuration ---
config system dns
    set primary 8.8.8.8
    set secondary 1.1.1.1
end
