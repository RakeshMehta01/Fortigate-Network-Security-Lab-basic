# ==============================================================================
# FortiGate NGFW - Complete Consolidated Configuration Script
# Device: FortiGate-VM64-KVM / FortiOS 7.x
# Description: Enterprise Perimeter Firewall with Multi-Zone Segmentation (LAN, DMZ, WAN, MGMT)
# Author: Rakesh Mehta
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System Hostname, DNS, and Initial Management Access
# ------------------------------------------------------------------------------
config system global
    set hostname "FortiGate-Core-FW"
    set timezone "04"
    set admintimeout 60
end

config system dns
    set primary 8.8.8.8
    set secondary 1.1.1.1
end

# ------------------------------------------------------------------------------
# 2. System Network Interfaces
# ------------------------------------------------------------------------------
config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 192.168.254.41 255.255.255.0
        set allowaccess ping https ssh http telnet
        set type physical
        set description "HOST-Only Management Network (MGMT-Cloud0)"
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 10.1.1.41 255.255.255.0
        set allowaccess ping ssh
        set type physical
        set description "Uplink to Core LAN-Switch (VLAN 1 Transit)"
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set mode static
        set ip 10.1.99.41 255.255.255.0
        set allowaccess ping
        set type physical
        set description "Isolated DMZ Segment (VLAN 99 / Web-Server)"
        set snmp-index 3
    next
    edit "port4"
        set vdom "root"
        set mode static
        set ip 200.1.1.41 255.255.255.0
        set allowaccess ping
        set type physical
        set description "Uplink to ISP Edge Router (200.1.1.0/24)"
        set snmp-index 4
    next
end

# ------------------------------------------------------------------------------
# 3. Static & Dynamic Routing (OSPF)
# ------------------------------------------------------------------------------
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 200.1.1.1
        set device "port4"
        set comment "Default route to ISP Edge Router"
    next
    edit 2
        set dst 10.1.0.0 255.255.0.0
        set gateway 10.1.1.254
        set device "port2"
        set comment "Static Summary Route to Branch 1 LAN subnets"
        set status enable
    next
end

config router ospf
    set router-id 10.1.1.41
    config area
        edit 0.0.0.0
            set shortcut disable
            set type regular
        next
    end
    config ospf-interface
        edit "port2_ospf"
            set interface "port2"
            set dead-interval 40
            set hello-interval 10
            set network-type broadcast
        next
    end
    config network
        edit 1
            set prefix 10.1.1.0 255.255.255.0
            set area 0.0.0.0
        next
    end
    set default-information-metric 10
    set default-information-metric-type 2
    set default-information-originate always
end

# ------------------------------------------------------------------------------
# 4. Firewall Address Objects, Groups, and Virtual IPs
# ------------------------------------------------------------------------------
config firewall address
    edit "NET_Branch1_Summary"
        set subnet 10.1.0.0 255.255.0.0
        set comment "Branch 1 Supernet / CIDR"
    next
    edit "NET_VLAN10_Users"
        set subnet 10.1.10.0 255.255.255.0
        set comment "End User Workstations (VPC2, Linux5)"
    next
    edit "NET_VLAN20_Developers"
        set subnet 10.1.20.0 255.255.255.0
        set comment "Software Developers Segment (PC3, Linux6)"
    next
    edit "NET_VLAN30_Admins"
        set subnet 10.1.30.0 255.255.255.0
        set comment "Systems & Network Administrators (PC4, Linux7)"
    next
    edit "NET_LAN_Transit"
        set subnet 10.1.1.0 255.255.255.0
        set comment "Transit link between FortiGate and LAN-Switch"
    next
    edit "NET_DMZ_Subnet"
        set subnet 10.1.99.0 255.255.255.0
        set comment "Demilitarized Zone (DMZ) Segment"
    next
    edit "HOST_DMZ_WebServer"
        set subnet 10.1.99.99 255.255.255.255
        set comment "Production Web Server host (pinglabs.in)"
    next
    edit "NET_WAN_Edge"
        set subnet 200.1.1.0 255.255.255.0
        set comment "WAN Public Transit Network"
    next
end

config firewall addrgrp
    edit "GRP_Internal_User_Segments"
        set member "NET_VLAN10_Users" "NET_VLAN20_Developers" "NET_VLAN30_Admins"
        set comment "Consolidated Internal User VLANs"
    next
end

config firewall vip
    edit "VIP_DMZ_Web_HTTP"
        set comment "Public Web publishing to Internal DMZ Server"
        set extip 200.1.1.41
        set extintf "port4"
        set portforward enable
        set protocol tcp
        set extport 80
        set mappedip "10.1.99.99"
        set mappedport 80
    next
end

# ------------------------------------------------------------------------------
# 5. Firewall Security Policies
# ------------------------------------------------------------------------------
config firewall policy
    edit 10
        set name "LAN_to_Internet_Outbound"
        set srcintf "port2"
        set dstintf "port4"
        set srcaddr "NET_Branch1_Summary"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "PING"
        set nat enable
        set logtraffic all
        set comment "Permit internal users Internet access with dynamic PAT"
    next
    edit 20
        set name "LAN_to_DMZ_WebServer"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "GRP_Internal_User_Segments"
        set dstaddr "HOST_DMZ_WebServer"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "SSH" "PING"
        set nat disable
        set logtraffic all
        set comment "Internal corporate access to DMZ Web Server and management"
    next
    edit 30
        set name "WAN_to_DMZ_WebServer_VIP"
        set srcintf "port4"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "VIP_DMZ_Web_HTTP"
        set action accept
        set schedule "always"
        set service "HTTP"
        set nat disable
        set logtraffic all
        set comment "Inbound internet traffic forwarding to DMZ Web Server"
    next
    edit 40
        set name "DMZ_to_Internet_Outbound"
        set srcintf "port3"
        set dstintf "port4"
        set srcaddr "NET_DMZ_Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "NTP" "HTTP" "HTTPS"
        set nat enable
        set logtraffic all
        set comment "Allow DMZ servers outbound access for OS patches and DNS"
    next
    edit 50
        set name "Admin_VLAN30_Management"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "NET_VLAN30_Admins"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "PING"
        set nat disable
        set logtraffic all
        set comment "Restricted administrative access from VLAN 30 to FortiGate MGMT"
    next
end
