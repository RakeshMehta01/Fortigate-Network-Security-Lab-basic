# ==============================================================================
# FortiGate NGFW - Firewall Address Objects, Groups, and Virtual IPs (VIP)
# ==============================================================================

# --- Firewall Address Objects ---
config firewall address
    edit "NET_Branch1_Summary"
        set subnet 10.1.0.0 255.255.0.0
        set comment "Branch 1 Supernet / CIDR"
    next
    edit "NET_VLAN10_Users"
        set subnet 10.1.10.0 255.255.255.0
        set comment "End User Workstations (VPC2, Linux5)"
    next
    edit "NET_VLAN20_Developers"
        set subnet 10.1.20.0 255.255.255.0
        set comment "Software Developers Segment (PC3, Linux6)"
    next
    edit "NET_VLAN30_Admins"
        set subnet 10.1.30.0 255.255.255.0
        set comment "Systems & Network Administrators (PC4, Linux7)"
    next
    edit "NET_LAN_Transit"
        set subnet 10.1.1.0 255.255.255.0
        set comment "Transit link between FortiGate and LAN-Switch"
    next
    edit "NET_DMZ_Subnet"
        set subnet 10.1.99.0 255.255.255.0
        set comment "Demilitarized Zone (DMZ) Segment"
    next
    edit "HOST_DMZ_WebServer"
        set subnet 10.1.99.99 255.255.255.255
        set comment "Production Web Server host (pinglabs.in)"
    next
    edit "NET_WAN_Edge"
        set subnet 200.1.1.0 255.255.255.0
        set comment "WAN Public Transit Network"
    next
end

# --- Address Groups ---
config firewall addrgrp
    edit "GRP_Internal_User_Segments"
        set member "NET_VLAN10_Users" "NET_VLAN20_Developers" "NET_VLAN30_Admins"
        set comment "Consolidated Internal User VLANs"
    next
end

# --- Virtual IP (DNAT / Port Forwarding for Web Server) ---
config firewall vip
    edit "VIP_DMZ_Web_HTTP"
        set comment "Public Web publishing to Internal DMZ Server"
        set extip 200.1.1.41
        set extintf "port4"
        set portforward enable
        set protocol tcp
        set extport 80
        set mappedip "10.1.99.99"
        set mappedport 80
    next
end
