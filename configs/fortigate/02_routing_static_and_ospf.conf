# ==============================================================================
# FortiGate NGFW - Static and Dynamic Routing (OSPF) Configuration
# ==============================================================================

# --- Default Static Route to ISP ---
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 200.1.1.1
        set device "port4"
        set comment "Default route to ISP Edge Router"
    next
    # Optional static route for Branch 1 if not utilizing pure dynamic OSPF
    edit 2
        set dst 10.1.0.0 255.255.0.0
        set gateway 10.1.1.254
        set device "port2"
        set comment "Static Summary Route to Branch 1 LAN subnets"
        set status enable
    next
end

# --- Dynamic Routing: OSPF Area 0 ---
# Establishes dynamic adjacency with Cisco LAN-Switch on Port2 (10.1.1.0/24)
config router ospf
    set router-id 10.1.1.41
    config area
        edit 0.0.0.0
            set shortcut disable
            set type regular
        next
    end
    config ospf-interface
        edit "port2_ospf"
            set interface "port2"
            set dead-interval 40
            set hello-interval 10
            set network-type broadcast
        next
    end
    config network
        edit 1
            set prefix 10.1.1.0 255.255.255.0
            set area 0.0.0.0
        next
    end
    config redistribute "connected"
        set status disable
    end
    config redistribute "static"
        set status disable
    end
    # Advertise default route to LAN-Switch
    set default-information-metric 10
    set default-information-metric-type 2
    set default-information-originate always
end
