# ==============================================================================
# FortiGate NGFW - Firewall Security Policies
# Implements Least Privilege Zone-to-Zone Access Control & Deep Inspection
# ==============================================================================

config firewall policy
    # --- Policy 1: Internal LAN to WAN (Internet Outbound) ---
    edit 10
        set name "LAN_to_Internet_Outbound"
        set srcintf "port2"
        set dstintf "port4"
        set srcaddr "NET_Branch1_Summary"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "PING"
        set nat enable
        set logtraffic all
        set comment "Permit internal users Internet access with dynamic PAT"
    next

    # --- Policy 2: Internal LAN to DMZ (Web Server Access) ---
    edit 20
        set name "LAN_to_DMZ_WebServer"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "GRP_Internal_User_Segments"
        set dstaddr "HOST_DMZ_WebServer"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "SSH" "PING"
        set nat disable
        set logtraffic all
        set comment "Internal corporate access to DMZ Web Server and management"
    next

    # --- Policy 3: WAN Inbound to DMZ Web Server via VIP (DNAT) ---
    edit 30
        set name "WAN_to_DMZ_WebServer_VIP"
        set srcintf "port4"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "VIP_DMZ_Web_HTTP"
        set action accept
        set schedule "always"
        set service "HTTP"
        set nat disable
        set logtraffic all
        set comment "Inbound internet traffic forwarding to DMZ Web Server"
    next

    # --- Policy 4: DMZ to WAN (Server Updates / External Services) ---
    edit 40
        set name "DMZ_to_Internet_Outbound"
        set srcintf "port3"
        set dstintf "port4"
        set srcaddr "NET_DMZ_Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "NTP" "HTTP" "HTTPS"
        set nat enable
        set logtraffic all
        set comment "Allow DMZ servers outbound access for OS patches and DNS"
    next

    # --- Policy 5: Administrative Management Access ---
    edit 50
        set name "Admin_VLAN30_Management"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "NET_VLAN30_Admins"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "PING"
        set nat disable
        set logtraffic all
        set comment "Restricted administrative access from VLAN 30 to FortiGate MGMT"
    next
end
